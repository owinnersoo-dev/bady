<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출산 준비 체크리스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#263d38;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}main{max-width:1200px;margin:auto;padding:36px 20px}h1{font-size:30px;margin:8px 0}p{color:#6b7772;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid #d3ddd6;background:white;border-radius:10px;padding:10px 14px;color:inherit}button:hover{background:#e9f1eb}.summary{background:#224e43;color:white;border-radius:18px;padding:20px;margin-bottom:24px}.track{height:8px;background:#ffffff30;border-radius:8px;margin-top:14px;overflow:hidden}.track i{display:block;background:#c9e8b8;height:100%;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}section{background:white;border:1px solid #e0e6df;border-radius:18px;overflow:hidden}header{padding:22px;background:#edf2eb}h2{margin:0 0 8px;font-size:23px}.count{font-size:14px;color:#587066}.note{font-size:13px;line-height:1.5;margin-top:10px;color:#637166}.row{display:grid;grid-template-columns:26px 1fr 30px;gap:10px;padding:15px 18px;border-bottom:1px solid #edf0ec;align-items:start}input[type=checkbox]{width:23px;height:23px;margin:2px 0;accent-color:#366b53}.text{font-size:16px;line-height:1.5;overflow-wrap:anywhere}.done .text{text-decoration:line-through;color:#8a9790}.memo{width:100%;font:inherit;font-size:13px;border:0;border-bottom:1px solid #e2e8e1;padding:7px 0;margin-top:4px;outline:none;color:#607168;background:transparent}.delete{border:0;padding:0;font-size:21px;color:#9daaa1;background:transparent}.add{display:flex;padding:16px;gap:8px}.add input{width:100%;min-width:0;border:1px solid #d9e1d8;border-radius:9px;padding:10px;font:inherit}.add button{white-space:nowrap}footer{font-size:12px;color:#7a847e;margin-top:24px;line-height:1.7}#status{font-size:12px;margin-top:10px} @media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:22px 14px}h1{font-size:26px}}@media print{body{background:white}main{padding:0}.grid{grid-template-columns:repeat(3,1fr);gap:10px}.toolbar,.add,.delete,#status,footer{display:none}.summary{background:white;color:#263d38;border:1px solid #ddd}.track{display:none}section{border-radius:0}header{padding:12px}.row{padding:9px;gap:5px;grid-template-columns:20px 1fr}.memo{font-size:11px}.text{font-size:12px}h2{font-size:18px}input[type=checkbox]{width:16px;height:16px}section{break-inside:auto}.row{break-inside:avoid}}
</style><main><p style="margin:0;font-size:12px;letter-spacing:2px">BABY PREPARATION</p><h1>출산 준비 체크리스트</h1><p>출산준비물 · 조리원 · 집, 세 곳의 준비물을 한눈에 확인하세요.</p><div class="toolbar"><button onclick="window.print()">인쇄 / PDF 저장</button><button onclick="downloadHTML()">현재 상태 HTML 저장</button><button onclick="resetChecks()">체크 초기화</button></div><div class="summary"><strong id="total"></strong><div class="track"><i id="bar"></i></div><div id="status" aria-live="polite">이 브라우저에 자동저장됩니다.</div></div><div class="grid" id="grid"></div><footer>첨부 사진의 목록을 그대로 세 항목으로 정리했습니다. 조리원 비용은 사진에 적힌 메모입니다.<br>체크·메모·추가 항목은 같은 브라우저에 저장됩니다. 다른 기기로 옮길 때는 ‘현재 상태 HTML 저장’을 이용하세요.</footer></main><script id="initial" type="application/json">[{"name": "출산준비물", "items": [{"text": "수건", "done": false, "memo": ""}, {"text": "샴푸", "done": false, "memo": ""}, {"text": "비누", "done": false, "memo": ""}, {"text": "휴지", "done": false, "memo": ""}, {"text": "물컵", "done": false, "memo": ""}, {"text": "슬리퍼", "done": false, "memo": ""}, {"text": "속옷", "done": false, "memo": ""}, {"text": "충전기", "done": false, "memo": ""}, {"text": "멀티탭", "done": false, "memo": ""}, {"text": "마스크", "done": false, "memo": ""}, {"text": "산모수첩 / 신분증", "done": false, "memo": ""}, {"text": "KF 마스크", "done": false, "memo": ""}, {"text": "수유패드", "done": false, "memo": ""}, {"text": "비판텐", "done": false, "memo": ""}, {"text": "복대", "done": false, "memo": ""}, {"text": "손목 / 발목 보호대", "done": false, "memo": ""}, {"text": "압박스타킹", "done": false, "memo": ""}, {"text": "일회용 젓가락", "done": false, "memo": ""}]}, {"name": "조리원", "note": "사진 메모: W여성병원 · 특실 일주일 160만원", "items": [{"text": "배냇저고리", "done": false, "memo": ""}, {"text": "속싸개 / 겉싸개", "done": false, "memo": ""}, {"text": "맘스안심팬티", "done": false, "memo": ""}, {"text": "생리대", "done": false, "memo": ""}, {"text": "텀블러 / 빨대", "done": false, "memo": ""}, {"text": "충전기 / 가습기", "done": false, "memo": ""}, {"text": "압박스타킹 / 수면양말", "done": false, "memo": ""}, {"text": "휴지 / 비데티슈 / 물티슈", "done": false, "memo": ""}, {"text": "슬리퍼", "done": false, "memo": ""}, {"text": "유축기 / 유축깔때기", "done": false, "memo": ""}, {"text": "철분제", "done": false, "memo": ""}]}, {"name": "집", "items": [{"text": "젖병건조대", "done": false, "memo": ""}, {"text": "분유포트", "done": false, "memo": ""}, {"text": "분유쉐이커", "done": false, "memo": ""}, {"text": "젖병", "done": false, "memo": ""}, {"text": "쪽쪽이", "done": false, "memo": ""}, {"text": "아기세제", "done": false, "memo": ""}, {"text": "원형러그", "done": false, "memo": ""}, {"text": "블랭킷", "done": false, "memo": ""}]}]</script><script>
const key='birth-preparation-checklist-v1';let groups=JSON.parse(document.getElementById('initial').textContent);try{const saved=localStorage.getItem(key);if(saved)groups=JSON.parse(saved)}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(groups));document.getElementById('status').textContent='자동저장됨 · '+new Date().toLocaleTimeString('ko-KR')}catch(e){document.getElementById('status').textContent='브라우저 저장을 사용할 수 없습니다. 현재 상태 HTML 저장을 이용하세요.'}update()}
function update(){let total=0,done=0;groups.forEach((g,i)=>{const n=g.items.filter(x=>x.done).length;total+=g.items.length;done+=n;document.getElementById('count'+i).textContent=n+' / '+g.items.length+'개 준비 완료'});document.getElementById('total').textContent='전체 '+done+' / '+total+'개 준비 완료';document.getElementById('bar').style.width=(total?done/total*100:0)+'%'}
function render(){document.getElementById('grid').innerHTML=groups.map((g,i)=>`<section><header><h2>${esc(g.name)}</h2><div class="count" id="count${i}"></div>${g.note?`<div class="note">${esc(g.note)}</div>`:''}</header>${g.items.map((x,j)=>`<div class="row ${x.done?'done':''}"><input type="checkbox" aria-label="${esc(x.text)} 준비 완료" ${x.done?'checked':''} onchange="toggle(${i},${j},this)"><div><label class="text" onclick="this.closest('.row').querySelector('input[type=checkbox]').click()">${esc(x.text)}</label><input class="memo" aria-label="${esc(x.text)} 메모" placeholder="수량 · 구입처 · 메모" value="${esc(x.memo)}" oninput="groups[${i}].items[${j}].memo=this.value;save()"></div><button class="delete" aria-label="${esc(x.text)} 삭제" onclick="removeItem(${i},${j})">×</button></div>`).join('')}<form class="add" onsubmit="addItem(event,${i})"><input aria-label="${esc(g.name)} 새 항목" placeholder="준비물 추가" required><button>추가</button></form></section>`).join('');update()}
function toggle(i,j,el){groups[i].items[j].done=el.checked;el.closest('.row').classList.toggle('done',el.checked);save()}function addItem(e,i){e.preventDefault();const t=e.target.querySelector('input').value.trim();if(!t)return;groups[i].items.push({text:t,done:false,memo:''});render();save()}function removeItem(i,j){if(confirm('“'+groups[i].items[j].text+'” 항목을 삭제할까요?')){groups[i].items.splice(j,1);render();save()}}function resetChecks(){if(confirm('모든 체크 표시를 초기화할까요? 메모와 항목은 유지됩니다.')){groups.forEach(g=>g.items.forEach(x=>x.done=false));render();save()}}
function downloadHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#initial').textContent=JSON.stringify(groups).replace(/</g,'\u003c');const script=copy.querySelectorAll('script')[1];script.textContent=script.textContent.replace("const key='birth-preparation-checklist-v1'","const key='birth-preparation-checklist-"+Date.now()+"'");const url=URL.createObjectURL(new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='출산준비_체크리스트_저장본.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></html>
